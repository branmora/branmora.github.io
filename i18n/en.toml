# Page descriptions (#105, spec 007): each page's <meta name="description">, which the social tags
# reuse. {{ .site }} is siteTitle; About's comes from its front matter, and a page with no text
# of its own uses description_page with its title.
description_home = "Projects and writing by {{ .site }} on AI, research, and economics."
description_topic = "{{ .topic }}: projects and writing by {{ .site }}."
# Each topic view's own line (spec 020, #205), approved by the author: its description in place of
# description_topic, which stays for a topic without a line of its own.
description_topic_minds-and-machines = "What brains and AI systems can teach each other: writing and projects on neuroscience, cognition, and machine learning."
description_topic_economics-of-ai = "How AI changes work, productivity, and markets, and how to measure it: writing and projects where economics meets AI."
description_topic_living-with-ai = "How people live with AI from day to day: the trust, habits, and attachments it creates, and what its changes cost them."
description_topic_open-science = "Open data, replication, and transparent research: writing and projects on making knowledge easier to find, check, and reuse."
description_topic_working-with-ai = "Working with AI agents in research and software: the workflows, tools, and conventions that make their work reliable."
description_about = "{{ .name }}, {{ .profession }} at the {{ .org }}: current work, earlier roles, education, and profiles elsewhere."
description_page = "{{ .title }}, on the site of {{ .site }}."

# The LinkedIn link of a post or note (spec 013, #129): it names the LinkedIn version, not an
# original that the page would follow.
linkedinVersion = "LinkedIn version"

# Projects (spec 011, #133): the projects list, a project page's metadata keys, its years, and the
# labels of its links. {{ .start }} and {{ .end }} are four-digit years.
projectsIntro = "Things I've built or led, and where to find them."
projectsEmpty = "No projects here yet."
# Projects in discovery (#134): a project's kind in search results and lists, and the heading of a
# topic view's projects.
kind_project = "project"
topicProjects = "Projects"
description_projects = "Projects by {{ .site }}: what each one is, the years it ran, and its links."
meta_years = "years"
meta_role = "role"
meta_links = "links"
yearsRange = "{{ .start }}–{{ .end }}"
yearsOngoing = "{{ .start }}–present"
projectLink_repository = "repository"
projectLink_website = "website"
projectLink_writing = "writing"
projectLink_talk = "talk"

# Header and footer (spec 010, #150): the navigation's places and its label, the footer's profiles
# key, and the writing page's intro and description. The theme toggle reads themeLabel and
# theme_<choice> above; contrast is set from the palette.
navLabel = "Site"
nav_writing = "writing"
nav_projects = "projects"
nav_about = "about"
footerProfiles = "profiles"
writingIntro = "Short posts and longer blog posts on AI, research, and economics."
description_writing = "Short posts and longer blog posts by {{ .site }} on AI, research, and economics."

# Home's hero (spec 010, #151). The sentence is heroLead, then one topic as heroTopic_<slug>
# words it (each links that topic's view, and only topics with something filed show); with no
# topic yet it is heroLeadAlone. heroBio is the line from the author's bio under the sentence
# (spec 016, #173), approved by the author; home names no employer or job title, which About keeps.
# heroProfiles labels the list of profile links.
heroLead = "Projects and writing on"
heroLeadAlone = "Projects and writing"
heroTopic_minds-and-machines = "minds and machines"
heroTopic_economics-of-ai = "the economics of AI"
heroTopic_living-with-ai = "living with AI"
heroTopic_open-science = "open science"
heroTopic_working-with-ai = "working with AI"
heroBio = "Data scientist and economist working on impact evaluation, generative AI, and experimentation in development"
heroProfiles = "Profiles"

# Home's live visual (spec 010, #152): the name of the dot plot of every post, note, and project.
liveLabel = "Everything here, by date and topic"

# Home's sections (spec 010, #153): the headings of the featured cards, the project cards, and
# the writing list.
homeFeatured = "Selected work"
homeProjects = "Projects"
homeWriting = "Writing"
