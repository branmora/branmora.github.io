# Interface strings for English. Every key here must also be in es.toml.
siteTitle = "Brandon Mora"
# The one-line description: the RSS channel, llms.txt, the site card's alt text, and the WebSite's
# structured data.
siteDescription = "Writing on AI, economics, and the social sciences"
# llms.txt (spec 023): after the description, the site's name and the full name as one person,
# then About in English.
llmsOnePerson = "%[1]s and %[2]s are the same person, the author of this site: %[3]s"
# After the name in home's <title> (spec 020, #202): the start of heroBio, the approved bio line,
# so the title fits in 60 characters.
homeTitle = "Data scientist and economist"

# Site header and footer (spec 006). The switcher names the other language in that language.
