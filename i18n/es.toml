# Page descriptions (#105, spec 007): each page's <meta name="description">, which the social tags
# reuse. {{ .site }} is siteTitle; About's comes from its front matter, and a page with no text
# of its own uses description_page with its title.
description_home = "Proyectos y posts de {{ .site }} sobre IA, investigación y economía."
description_topic = "{{ .topic }}: proyectos y posts de {{ .site }}."
# Each topic view's own line (spec 020, #205), approved by the author: its description in place of
# description_topic, which stays for a topic without a line of its own.
description_topic_minds-and-machines = "Lo que el cerebro y los sistemas de IA pueden enseñarse entre sí: textos y proyectos sobre neurociencia, cognición y aprendizaje automático."
description_topic_economics-of-ai = "Cómo la IA cambia el trabajo, la productividad y los mercados, y cómo medirlo: textos y proyectos donde la economía se cruza con la IA."
description_topic_living-with-ai = "Cómo convivimos con la IA en el día a día: la confianza, los hábitos y los vínculos que crea, y lo que nos cuestan sus cambios."
description_topic_open-science = "Datos abiertos, replicación e investigación transparente: textos y proyectos para que el conocimiento sea fácil de encontrar, verificar y reutilizar."
description_topic_working-with-ai = "Trabajar con agentes de IA en investigación y software: los flujos de trabajo, las herramientas y las convenciones que vuelven confiable su trabajo."
