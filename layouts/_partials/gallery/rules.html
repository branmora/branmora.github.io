<div class="column rules">
  <p>{{ .c.above }}</p>
  <hr>
  <p>{{ .c.below }}</p>
  <p class="frame">{{ .c.frame }}</p>
  <table>
    <thead><tr>{{ range .c.tableHead }}<th scope="col">{{ . }}</th>{{ end }}</tr></thead>
    <tbody>{{ range .c.tableRows }}<tr>{{ range . }}<td>{{ . }}</td>{{ end }}</tr>{{ end }}</tbody>
  </table>
</div>
