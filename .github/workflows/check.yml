# The check on every pull request to main, a piece or a release: the production build, which
# enforces CONTENT.md. A piece the build rejects fails it, with the build's message naming the
# content file and the field. This file comes from releases of the site's theme; do not edit it here.
name: check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history, so each page's modified date is the last commit of its own content file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
      - name: Install the Hugo version pinned in .hugo-version
        run: |
          v="$(tr -d '[:space:]' < .hugo-version)"
          base="https://github.com/gohugoio/hugo/releases/download/v${v}"
          tarball="hugo_extended_${v}_linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSL "${base}/hugo_${v}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          mkdir -p hugo-bin && tar -xzf "${tarball}" -C hugo-bin hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - run: hugo version
      - run: uv sync --locked
      - name: Build the production site
        run: uv run scripts/hugo.py
